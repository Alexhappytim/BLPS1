plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.blps'
version = '0.0.1-SNAPSHOT'
description = 'Backend for learning platform business processes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.glassfish.jersey.core:jersey-client:3.1.10'
    implementation 'jakarta.resource:jakarta.resource-api:2.1.0'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.10'
    implementation 'org.jboss.narayana.jta:narayana-jta:7.3.3.Final'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    // Camunda BPM 7 Spring Boot Starter (Jakarta EE / Spring Boot 3 compatible)
    implementation 'org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter:7.22.0'
    implementation 'org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-webapp:7.22.0'
    implementation 'org.camunda.bpm:camunda-engine-plugin-spin:7.22.0'
    implementation 'org.camunda.spin:camunda-spin-dataformat-json-jackson:7.22.0'
    implementation 'org.camunda.spin:camunda-spin-core:7.22.0'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootWar {
    archiveFileName = 'ROOT.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

war {
    archiveFileName = 'ROOT.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
}

